<!-- --------------------------------------------------------------------------
   Conteúdo Principal da Landing Page

  <!-- Seções below-fold: hidratam somente ao entrar na viewport -->
  @defer (on viewport) {
    <app-categories />
  } @placeholder {
    <div></div>
  }
  @defer (on viewport) {
    <app-coupon-banner />
  } @placeholder {
    <div></div>
  }
  @defer (on viewport) {
    <app-catalog />
  } @placeholder {
    <div></div>
  }
  @defer (on viewport) {
    <app-newsletter />
  } @placeholder {
    <div></div>
  }
  @defer (on viewport) {
    <app-brewing-calculator />
  } @placeholder {
    <div></div>
  }
  @defer (on viewport) {
    <app-our-history />
  } @placeholder {
    <div></div>
  }
  @defer (on viewport) {
    <app-guarantees />
  } @placeholder {
    <div></div>
  }
</main>

   Rodapé Institucional
