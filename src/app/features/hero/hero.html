<!-- --------------------------------------------------------------------------
   Seção: Hero Principal (Banner Institucional e Clube de Assinatura)
   -------------------------------------------------------------------------- -->
<section
  id="hero"
  aria-label="Apresentação Terra & Grão"
  class="w-full bg-hero-bg relative overflow-hidden"
>
  <!-- Imagem de Fundo com Grãos de Café -->
  <div class="pointer-events-none absolute inset-0 z-0 mx-auto max-w-[2000px] overflow-hidden select-none">
    <div class="absolute -right-6 sm:-right-8 lg:right-0 bottom-0 flex w-[114%] sm:w-[110%] lg:w-[54%] xl:w-[60%] justify-end translate-y-[30%]">
      <div class="w-full max-w-[1500px]">
        <!-- picture: mobile recebe versão 550px, desktop recebe 1000px -->
        <picture>
          <source
            media="(max-width: 767px)"
            srcset="/images/hero/beans-bg-mobile.webp"
            type="image/webp"
          />
          <img
            src="/images/hero/beans-bg.webp"
            alt=""
            aria-hidden="true"
            width="1000"
            height="669"
            class="h-auto w-full object-contain object-bottom-right pointer-events-none select-none"
            fetchpriority="high"
            loading="eager"
          />
        </picture>
      </div>
    </div>
  </div>

  <div class="mx-auto max-w-[1728px] px-4 sm:px-6 lg:px-12 py-12 sm:py-16 lg:py-20 xl:py-24 relative z-10">
    <div class="flex flex-col lg:flex-row items-center justify-between gap-12 lg:gap-20 xl:gap-24">

      <!-- ----------------------------------------------------------------------
         Coluna Esquerda: Textos Institucionais e Botões de Ação
         ---------------------------------------------------------------------- -->
      <div class="w-full lg:w-[55%] flex flex-col items-start justify-center">
        <div class="w-fit max-w-xl xl:max-w-2xl space-y-6 sm:space-y-8">
          <!-- Título e Subtítulo -->
          <div class="space-y-4">
            <h1 class="hero-anim-title font-display text-3xl font-bold tracking-tight text-text-main sm:text-4xl lg:text-5xl xl:text-6xl leading-[1.12]">
              O melhor do café especial brasileiro na sua xícara
            </h1>
            <p class="hero-anim-subtitle font-body text-sm sm:text-base lg:text-lg text-text-main leading-relaxed">
              Receba microlotes exclusivos todo mês pelo clube ou abasteça sua casa direto em nossa loja
            </p>
          </div>

          <!-- Botões de Ação para Desktop -->
          <div class="hero-anim-buttons hidden lg:flex flex-row items-stretch gap-4 pt-2 w-full">
            <!-- Botão Primário: Fazer Assinatura -->
            <button
              type="button"
              (click)="scrollToSection('catalogo')"
              class="flex-1 inline-flex items-center justify-center rounded-[2px] bg-primary py-3.5 text-sm font-semibold uppercase tracking-wider text-bg-main shadow-xs transition-all duration-200 hover:bg-primary-hover active:scale-[0.98] cursor-pointer"
            >
              Fazer Assinatura
            </button>

            <!-- Botão Secundário: Nossa Loja -->
            <button
              type="button"
              (click)="scrollToSection('catalogo')"
              class="flex-1 inline-flex items-center justify-center rounded-[2px] border-2 border-text-main bg-hero-bg py-3.5 text-sm font-semibold uppercase tracking-wider text-text-main transition-all duration-200 hover:bg-text-main/10 active:scale-[0.98] cursor-pointer"
            >
              Nossa Loja
            </button>
          </div>
        </div>
      </div>

      <!-- ----------------------------------------------------------------------
         Coluna Direita: Composição Visual com Embalagem e Xícara de Café
         ---------------------------------------------------------------------- -->
      <div class="w-full lg:w-[45%] flex items-center justify-center relative min-h-[260px] sm:min-h-[320px] lg:min-h-[380px]">

        <!-- Grupo da Composição Visual -->
        <div class="hero-composition-group relative flex items-center justify-center translate-y-2 lg:translate-y-6">

          <!-- Embalagem de Café -->
          <div class="hero-anim-package relative z-0">
            <!-- picture: mobile recebe versão 220px, desktop recebe 350px -->
            <picture>
              <source
                media="(max-width: 767px)"
                srcset="/images/hero/coffee-package-mobile.webp"
                type="image/webp"
              />
              <img
                src="/images/hero/coffee-package.webp"
                alt="Embalagem de Café Especial Terra & Grão"
                width="350"
                height="576"
                class="w-36 sm:w-44 md:w-52 lg:w-60 h-auto object-contain drop-shadow-2xl pointer-events-none select-none"
                fetchpriority="high"
                loading="eager"
              />
            </picture>
          </div>

          <!-- Xícara de Café Sobreposta -->
          <div class="hero-anim-cup absolute -left-10 sm:-left-14 md:-left-16 -bottom-4 sm:-bottom-6 lg:-bottom-8 z-10">
            <!-- picture: mobile recebe versão 170px, desktop recebe 350px -->
            <picture>
              <source
                media="(max-width: 767px)"
                srcset="/images/hero/coffee-cup-mobile.webp"
                type="image/webp"
              />
              <img
                src="/images/hero/coffee-cup.webp"
                alt="Xícara de Café Especial"
                width="350"
                height="265"
                class="w-24 sm:w-32 md:w-36 lg:w-44 h-auto object-contain drop-shadow-2xl pointer-events-none select-none"
                loading="eager"
              />
            </picture>
          </div>

        </div>

      </div>

      <!-- ----------------------------------------------------------------------
         Botões de Ação para Dispositivos Móveis e Tablets
         ---------------------------------------------------------------------- -->
      <div class="hero-anim-buttons flex lg:hidden flex-col sm:flex-row items-stretch gap-3 sm:gap-4 w-full pt-1">
        <button
          type="button"
          (click)="scrollToSection('catalogo')"
          class="w-full sm:flex-1 inline-flex items-center justify-center rounded-[2px] bg-primary py-3 sm:py-3.5 text-xs sm:text-sm font-semibold uppercase tracking-wider text-bg-main shadow-xs transition-all duration-200 hover:bg-primary-hover active:scale-[0.98] cursor-pointer"
        >
          Fazer Assinatura
        </button>

        <button
          type="button"
          (click)="scrollToSection('catalogo')"
          class="w-full sm:flex-1 inline-flex items-center justify-center rounded-[2px] border-2 border-text-main bg-hero-bg py-3.5 text-xs sm:text-sm font-semibold uppercase tracking-wider text-text-main transition-all duration-200 hover:bg-text-main/10 active:scale-[0.98] cursor-pointer"
        >
          Nossa Loja
        </button>
      </div>

    </div>
  </div>
</section>
