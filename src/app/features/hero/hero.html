<!-- Secao Hero Principal: Banner Institucional & Clube de Assinatura (Full Width) -->
<section
  id="hero"
  aria-label="Apresentação Terra & Grão"
  class="w-full bg-hero-bg border-b border-border relative overflow-hidden"
>
  <!-- Background de Grãos de Café: Preso no bloco central com limite amplo de 2000px para telas ultrawide -->
  <div class="pointer-events-none absolute inset-0 z-0 mx-auto max-w-[2000px] overflow-hidden select-none">
    <div class="absolute right-0 bottom-0 flex w-full justify-end sm:w-4/5 lg:w-[54%] xl:w-[60%] translate-y-[30%]">
      <div class="w-full max-w-[1500px]">
        <img
          src="/images/hero-beans-bg.png"
          alt=""
          aria-hidden="true"
          class="h-auto w-full object-contain object-bottom-right pointer-events-none select-none"
          loading="eager"
        />
      </div>
    </div>
  </div>

  <div class="mx-auto max-w-[1728px] px-4 sm:px-6 lg:px-12 py-12 sm:py-16 lg:py-20 xl:py-24 relative z-10">
    <div class="flex flex-col lg:flex-row items-center justify-between gap-12 lg:gap-20 xl:gap-24">

      <!-- Lado Esquerdo: Textos Institucionais & Botoes de Acao (55% no Desktop) -->
      <div class="w-full lg:w-[55%] flex flex-col items-start justify-center">
        <div class="w-fit max-w-xl xl:max-w-2xl space-y-6 sm:space-y-8">
          <!-- Titulo e Subtitulo -->
          <div class="space-y-4">
            <h1 class="font-display text-3xl font-bold tracking-tight text-primary sm:text-4xl lg:text-5xl xl:text-6xl leading-[1.12]">
              O melhor do café especial brasileiro na sua xícara
            </h1>
            <p class="font-body text-sm sm:text-base lg:text-lg text-primary leading-relaxed">
              Receba microlotes exclusivos todo mês pelo clube ou abasteça sua casa direto em nossa loja
            </p>
          </div>

          <!-- Botões de Ação (Apenas Desktop lg+) -->
          <div class="hidden lg:flex flex-row items-stretch gap-4 pt-2 w-full">
            <!-- Botao Primario: Fazer Assinatura -->
            <button
              type="button"
              (click)="scrollToSection('catalogo')"
              class="flex-1 inline-flex items-center justify-center rounded-[2px] bg-primary py-3.5 text-sm font-semibold uppercase tracking-wider text-bg-main shadow-xs transition-all duration-200 hover:bg-primary-hover active:scale-[0.98] cursor-pointer"
            >
              Fazer Assinatura
            </button>

            <!-- Botao Secundario: Nossa Loja -->
            <button
              type="button"
              (click)="scrollToSection('catalogo')"
              class="flex-1 inline-flex items-center justify-center rounded-[2px] border-2 border-primary bg-hero-bg py-3.5 text-sm font-semibold uppercase tracking-wider text-primary transition-all duration-200 hover:border-primary-hover hover:text-primary-hover active:scale-[0.98] cursor-pointer"
            >
              Nossa Loja
            </button>
          </div>
        </div>
      </div>

      <!-- Lado Direito: Container para os Produtos Futuros (Embalagem + Xícara) -->
      <div class="w-full lg:w-[45%] flex items-center justify-center relative min-h-[220px] sm:min-h-[300px] lg:min-h-[380px]">
        <!-- Espaço reservado para as imagens da embalagem e xícara -->
      </div>

      <!-- Botões de Ação (Mobile e Tablet: Abaixo da Imagem) -->
      <div class="flex lg:hidden flex-col sm:flex-row items-stretch gap-3 sm:gap-4 w-full pt-1">
        <button
          type="button"
          (click)="scrollToSection('catalogo')"
          class="w-full sm:flex-1 inline-flex items-center justify-center rounded-[2px] bg-primary py-3 sm:py-3.5 text-xs sm:text-sm font-semibold uppercase tracking-wider text-bg-main shadow-xs transition-all duration-200 hover:bg-primary-hover active:scale-[0.98] cursor-pointer"
        >
          Fazer Assinatura
        </button>

        <button
          type="button"
          (click)="scrollToSection('catalogo')"
          class="w-full sm:flex-1 inline-flex items-center justify-center rounded-[2px] border-2 border-primary bg-hero-bg py-3.5 text-xs sm:text-sm font-semibold uppercase tracking-wider text-primary transition-all duration-200 hover:border-primary-hover hover:text-primary-hover active:scale-[0.98] cursor-pointer"
        >
          Nossa Loja
        </button>
      </div>

    </div>
  </div>
</section>
