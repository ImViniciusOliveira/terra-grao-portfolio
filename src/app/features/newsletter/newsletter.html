<section
  id="newsletter"
  aria-labelledby="newsletter-heading"
  class="w-full bg-bg-secondary border-t border-border py-12 sm:py-16"
>
  <div class="mx-auto max-w-[1728px] w-full px-4 sm:px-6 lg:px-8">
    <div class="max-w-2xl mx-auto text-center space-y-4">
      <h2
        id="newsletter-heading"
        class="font-display text-2xl sm:text-3xl font-medium text-text-main"
      >
        Receba novidades e ofertas exclusivas
      </h2>

      <p class="text-xs sm:text-sm md:text-base text-text-secondary font-body">
        Cadastre seu e-mail para receber avisos de novos lotes e ofertas especiais.
      </p>

      <form
        (ngSubmit)="onSubmit()"
        class="flex flex-col sm:flex-row gap-2.5 max-w-md mx-auto"
      >
        <input
          type="email"
          required
          [value]="email()"
          (input)="onEmailInput($event)"
          placeholder="Digite seu e-mail"
          aria-label="Digite seu e-mail para receber novidades"
          class="flex-1 bg-bg-main border border-border rounded-[2px] px-3.5 py-2.5 text-xs sm:text-sm text-text-main placeholder:text-text-muted focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
        />
        <button
          type="submit"
          class="px-5 py-2.5 bg-primary hover:bg-primary-hover active:scale-[0.98] text-bg-main text-xs sm:text-sm font-semibold uppercase tracking-wider rounded-[2px] transition-all cursor-pointer shadow-xs focus:outline-none focus-visible:ring-2 focus-visible:ring-primary shrink-0"
        >
          Cadastrar
        </button>
      </form>
    </div>
  </div>
</section>
