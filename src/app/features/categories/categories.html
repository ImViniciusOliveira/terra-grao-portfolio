<!-- Seção: Categorias Rápidas (5 Itens Ampliados) -->
<section
  id="categorias"
  aria-label="Categorias de Cafés e Métodos"
  class="bg-bg-main py-12 sm:py-16 lg:py-20"
>
  <div class="mx-auto max-w-[1536px] px-4 sm:px-6 lg:px-8">
    <!-- Cabeçalho Acessível (Invisível Visualmente) -->
    <h2 class="sr-only">Categorias em Destaque</h2>

    <!-- Grade Desktop Ampliada (5 Itens Preenchendo com Destaque Visual) -->
    <div class="hidden lg:grid lg:grid-cols-5 gap-6 lg:gap-8 xl:gap-10 2xl:gap-12 w-full items-start">
      @for (category of categories(); track category.id) {
        <button
          type="button"
          (click)="scrollToSection(category.targetSection)"
          [attr.aria-label]="'Navegar para ' + category.name"
          class="category-card-item group flex flex-col items-center justify-center cursor-pointer select-none outline-none bg-transparent border-0 w-full"
        >
          <!-- Círculo Ampliado da Imagem -->
          <div class="w-44 h-44 lg:w-48 lg:h-48 xl:w-56 xl:h-56 2xl:w-60 2xl:h-60 rounded-full overflow-hidden shadow-xs transition-transform duration-300 ease-out group-hover:scale-105">
            <img
              [src]="category.imageUrl"
              [alt]="category.name"
              class="w-full h-full object-cover object-center"
              loading="lazy"
            />
          </div>

          <!-- Título Oficial Ampliado e Proporcional -->
          <span class="mt-5 font-body text-sm xl:text-base font-semibold uppercase tracking-wider text-text-main group-hover:text-primary transition-colors duration-200 text-center">
            {{ category.name }}
          </span>
        </button>
      }
    </div>

    <!-- Carrossel por Páginas (Página 1: 3 itens | Página 2: restantes) -->
    <div
      #categoryCarousel
      (scroll)="onScroll($event)"
      class="flex lg:hidden w-full overflow-x-auto scroll-smooth snap-x snap-mandatory no-scrollbar py-1"
    >
      <!-- Página 1 (3 Primeiros Itens) -->
      <div class="w-full shrink-0 snap-start grid grid-cols-3 gap-1.5 sm:gap-2.5 md:gap-3.5 px-0.5">
        @for (category of page1Categories(); track category.id) {
          <button
            type="button"
            (click)="scrollToSection(category.targetSection)"
            [attr.aria-label]="'Navegar para ' + category.name"
            class="category-card-item group flex flex-col items-center justify-start cursor-pointer select-none outline-none bg-transparent border-0 px-0.5"
          >
            <!-- Círculo da Imagem Bem Maior e Quase Encostando -->
            <div class="w-full max-w-[124px] sm:max-w-[150px] md:max-w-[180px] aspect-square rounded-full overflow-hidden shadow-xs mx-auto transition-transform duration-300 ease-out group-hover:scale-105">
              <img
                [src]="category.imageUrl"
                [alt]="category.name"
                class="w-full h-full object-cover object-center"
                loading="lazy"
              />
            </div>

            <!-- Título Mobile -->
            <span class="mt-2 sm:mt-2.5 font-body text-[11px] sm:text-xs md:text-sm font-bold uppercase tracking-wider text-text-main group-hover:text-primary transition-colors text-center line-clamp-2 leading-tight">
              {{ category.name }}
            </span>
          </button>
        }
      </div>

      <!-- Página 2 (Próximos Itens) -->
      <div class="w-full shrink-0 snap-start grid grid-cols-3 gap-1.5 sm:gap-2.5 md:gap-3.5 px-0.5">
        @for (category of page2Categories(); track category.id) {
          <button
            type="button"
            (click)="scrollToSection(category.targetSection)"
            [attr.aria-label]="'Navegar para ' + category.name"
            class="category-card-item group flex flex-col items-center justify-start cursor-pointer select-none outline-none bg-transparent border-0 px-0.5"
          >
            <!-- Círculo da Imagem Bem Maior e Quase Encostando -->
            <div class="w-full max-w-[124px] sm:max-w-[150px] md:max-w-[180px] aspect-square rounded-full overflow-hidden shadow-xs mx-auto transition-transform duration-300 ease-out group-hover:scale-105">
              <img
                [src]="category.imageUrl"
                [alt]="category.name"
                class="w-full h-full object-cover object-center"
                loading="lazy"
              />
            </div>

            <!-- Título Mobile -->
            <span class="mt-2 sm:mt-2.5 font-body text-[11px] sm:text-xs md:text-sm font-bold uppercase tracking-wider text-text-main group-hover:text-primary transition-colors text-center line-clamp-2 leading-tight">
              {{ category.name }}
            </span>
          </button>
        }
      </div>
    </div>

    <!-- Indicador em 2 Pontos (Preto Ativo e Cinza Inativo) -->
    <div class="flex lg:hidden items-center justify-center gap-2 mt-5 sm:mt-6" aria-label="Indicador de páginas de categorias">
      <button
        type="button"
        (click)="scrollToPage(0, categoryCarousel)"
        aria-label="Ir para a primeira página de categorias"
        class="w-2.5 h-2.5 rounded-full transition-colors duration-200 cursor-pointer p-0 border-0 outline-none"
        [class.bg-text-main]="activePage() === 0"
        [class.bg-stone-300]="activePage() !== 0"
      ></button>
      <button
        type="button"
        (click)="scrollToPage(1, categoryCarousel)"
        aria-label="Ir para a segunda página de categorias"
        class="w-2.5 h-2.5 rounded-full transition-colors duration-200 cursor-pointer p-0 border-0 outline-none"
        [class.bg-text-main]="activePage() === 1"
        [class.bg-stone-300]="activePage() !== 1"
      ></button>
    </div>
  </div>
</section>
